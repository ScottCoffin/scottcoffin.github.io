name: Guidance guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guidance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check repository guidance
        run: node scripts/check_repo_guidance.mjs
